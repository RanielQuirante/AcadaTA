name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature-*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (recommended for consistent builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build Docker image (includes build + test + publish inside Dockerfile)
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/adacata-webapi:${{ github.sha }} .

      # 5. Push the image to GHCR with SHA tag
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.actor }}/adacata-webapi:${{ github.sha }}

      # 6. Optionally tag and push as 'latest' if main branch
      - name: Tag image as latest
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker tag ghcr.io/${{ github.actor }}/adacata-webapi:${{ github.sha }} ghcr.io/${{ github.actor }}/adacata-webapi:latest
          docker push ghcr.io/${{ github.actor }}/adacata-webapi:latest