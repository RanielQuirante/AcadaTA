name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature-*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 3. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # 4. Set lowercase GitHub username
      - name: Set lowercase actor
        id: actor_lc
        run: echo "value=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 5. Build Docker image
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ steps.actor_lc.outputs.value }}/adacata-webapi:${{ github.sha }} .

      # 6. Push Docker image
      - name: Push Docker image
        run: docker push ghcr.io/${{ steps.actor_lc.outputs.value }}/adacata-webapi:${{ github.sha }}

      # 7. Tag image as latest (optional)
      - name: Tag image as latest
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker tag ghcr.io/${{ steps.actor_lc.outputs.value }}/adacata-webapi:${{ github.sha }} ghcr.io/${{ steps.actor_lc.outputs.value }}/adacata-webapi:latest
          docker push ghcr.io/${{ steps.actor_lc.outputs.value }}/adacata-webapi:latest